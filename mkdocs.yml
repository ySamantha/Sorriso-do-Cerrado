site_name: Sorriso do Cerrado
site_description: Documentação Oficial do Marketplace Sorriso do Cerrado — Soluções Computacionais 2026/2 (UCB)
site_author: Equipe Sorriso do Cerrado — Engenharia de Software UCB
repo_name: ySamantha/Sorriso-do-Cerrado
repo_url: https://github.com/ySamantha/Sorriso-do-Cerrado
edit_uri: ""

theme:
  name: material
  language: pt-BR
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list

nav:
  - Início: README.md
  - Engenharia de Software:
      - Business Model Canvas: engenharia/bmc.md
      - Documento de Visão (v2.1): engenharia/visao.md
      - Requisitos de Software (v3.0): engenharia/requisitos.md
      - Histórias de Usuário: engenharia/historias-de-usuario.md
      - Especificação de Casos de Uso: engenharia/casos-de-uso.md
      - Arquitetura de Software (v2.0): engenharia/arquitetura.md
      - Modelo de Dados: engenharia/modelo-de-dados.md
      - Interfaces & Usabilidade: engenharia/interfaces.md
  - Diagramas do Sistema:
      - Casos de Uso (v2.0): diagramas/casos-de-uso.md
      - Fluxos de Navegação: diagramas/fluxos-de-navegacao.md
      - Diagramas de Atividades (12): diagramas/atividades.md
      - Diagramas de Classes (6): diagramas/classes.md
      - Diagramas de Sequência (4): diagramas/sequencia.md
      - Arquitetura, Pacotes & Implantação: diagramas/arquitetura.md
  - Protótipos & Telas:
      - Protótipos de Alta Fidelidade: prototipos/mockups.md
      - Telas Implementadas: prototipos/telas-implementadas.md
  - Central de Downloads: downloads/index.md
  - Material do Semestre Anterior:
      - Sobre o Acervo Anterior: semestre-anterior/index.md
      - Visão Geral (v1.0): semestre-anterior/visao-geral.md
      - Engenharia (Semestre Anterior):
          - Documento de Visão (v1.0): semestre-anterior/engenharia/visao.md
          - Requisitos de Software (v2.0): semestre-anterior/engenharia/requisitos.md
          - Histórias de Usuário (v1.0): semestre-anterior/engenharia/historias-de-usuario.md
          - Casos de Uso (v2.0): semestre-anterior/engenharia/casos-de-uso.md
          - Arquitetura de Software (v1.0): semestre-anterior/engenharia/arquitetura.md
          - Interfaces & Usabilidade (v1.1): semestre-anterior/engenharia/interfaces.md
      - Diagramas (Semestre Anterior):
          - Casos de Uso (v1.0): semestre-anterior/diagramas/casos-de-uso.md
          - Fluxos de Navegação (v1.0): semestre-anterior/diagramas/fluxos-de-navegacao.md
          - Diagramas de Atividades (v1.0): semestre-anterior/diagramas/atividades.md
          - Classes e Sequência (v1.0): semestre-anterior/diagramas/classes-e-sequencia.md
          - Arquitetura (v1.0): semestre-anterior/diagramas/arquitetura.md
      - Protótipos & Telas (Semestre Anterior):
          - Protótipos de Alta Fidelidade (v1.0): semestre-anterior/prototipos/mockups.md
          - Telas Implementadas (v1.0): semestre-anterior/prototipos/telas-implementadas.md
      - Downloads (Semestre Anterior): semestre-anterior/downloads.md
